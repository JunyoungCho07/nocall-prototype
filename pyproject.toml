[project]
name = "nocall-prototype"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "fastapi>=0.136.3",
    "lap>=0.5.12",
    "opencv-python>=4.13.0.92",
    "python-dotenv>=1.2.2",
    "qrcode[pil]>=8.2",
    "roboflow>=1.3.9",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "ultralytics>=8.4.60",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
# 커스텀 이미지 자동 라벨링 전용 (train/auto_label.py). 학습/앱 실행엔 불필요.
# 설치:  uv sync --extra label
# transformers는 GroundingDINO 호환을 위해 4.x 고정, scikit-learn은 DLL 차단 회피용 핀.
label = [
    "autodistill>=0.1.29",
    "autodistill-grounding-dino>=0.1.4",
    "scikit-learn==1.5.2",
    "transformers==4.44.2",
]

# RTX 4070 GPU 학습용 CUDA 12.8 빌드 (Windows/Linux 전용)
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Windows: CUDA 12.8 휠 / macOS: PyPI 기본 (MPS/CPU)
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
