[project]
name = "nocall-prototype"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "fastapi>=0.136.3",
    "lap>=0.5.12",
    "opencv-python>=4.13.0.92",
    "python-dotenv>=1.2.2",
    "qrcode[pil]>=8.2",
    "roboflow>=1.3.9",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "ultralytics>=8.4.60",
    "uvicorn[standard]>=0.49.0",
]

# RTX 4050 GPU 학습용 CUDA 12.8 빌드 (기본 PyPI는 CPU 전용 휠만 제공)
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
